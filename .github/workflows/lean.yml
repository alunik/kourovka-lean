name: Lean proofs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # A 21.99 kernel-check batch can use about 6 GiB; private runners have 8 GB.
      LEAN_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "true"
          use-mathlib-cache: "true"
          # Archiving all of .lake exhausted the runner disk after a successful build.
          use-github-cache: "false"
      - name: Check public statements and axiom dependencies
        run: lake env lean Audit.lean
